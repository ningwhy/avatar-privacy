<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 — 动漫头像制作</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif;
         background:#FDF7EC; color:#3A3226; }
  .box { text-align:center; padding:40px 24px; }
  .code { font-size:64px; font-weight:800; color:#F0A21B; }
  p { margin:12px 0 24px; color:#6F685C; font-size:15px; }
  a { display:inline-block; background:#3A3226; color:#fff; text-decoration:none;
      padding:11px 22px; border-radius:12px; font-weight:600; font-size:14px; }
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <p>你访问的页面不存在。<br>The page you requested was not found.</p>
  <a href="/">返回首页 / Home</a>
</div>
</body>
</html>
